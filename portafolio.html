<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portafolio | Salvador Abé Castro</title>

    <meta
        name="description"
        content="Portafolio de arquitectura de Salvador Abé"
    >

    <style>

        /* =====================================================
           BASE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            color: #111111;
            font-family: Helvetica, Arial, sans-serif;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
            font-size: 13px;
        }

        .nombre {
            color: #111111;
            text-decoration: none;
            pointer-events: auto;
            cursor: pointer;
        }

        .navegacion {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navegacion a {
            color: #111111;
            text-decoration: none;
            pointer-events: auto;
            cursor: pointer;
        }

        /* "Portafolio" es un botón: vuelve a la portada */
        #volver {
            border: none;
            background: none;
            padding: 0;
            font: inherit;
            color: inherit;
            pointer-events: auto;
            cursor: pointer;
        }


        /* =====================================================
           PORTAFOLIO
        ===================================================== */

        .portafolio {
            width: 100%;
            min-height: 100vh;
            padding: 90px 40px 50px;
        }


        /* =====================================================
           GRILLA
        ===================================================== */

        .grilla {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 18px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .objeto {
            position: relative;
            width: 100%;
            cursor: pointer;
            z-index: 1;
            transition: transform 0.35s ease;
        }

        .objeto img {
            display: block;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: box-shadow 0.35s ease;
        }

        .objeto:hover {
            z-index: 10;
            transform: translateY(-5px) scale(1.025);
        }

        .objeto:hover img {
            box-shadow: 0 14px 35px rgba(0,0,0,0.14);
        }


        /* =====================================================
           ESTADO 1: PORTADA
        ===================================================== */

        body[data-estado="portada"] .portafolio {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 80px 40px 50px;
        }

        body[data-estado="portada"] .grilla {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        body[data-estado="portada"] .objeto:not(:first-child) {
            display: none;
        }

        body[data-estado="portada"] .objeto:first-child {
            width: auto;
            height: 100%;
        }

        body[data-estado="portada"] .objeto:first-child img {
            width: auto;
            height: 100%;
            max-width: 90vw;
            object-fit: contain;
        }

        body[data-estado="portada"] #volver {
            cursor: default;
        }


        /* =====================================================
           ESTADO 2: GRILLA
        ===================================================== */

        @keyframes desplegar {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        body[data-estado="grilla"] .objeto {
            animation: desplegar 0.5s ease both;
            animation-delay: calc(var(--i) * 30ms);
        }


        /* =====================================================
           VISOR (doble página + zoom)
        ===================================================== */

        .visor {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;

            /* El zoom y el arrastre los manejamos nosotros, no el navegador */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .visor.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .paginas {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transform-origin: 50% 50%;
            transition: opacity 0.15s ease;
        }

        /* Animación suave (botones, doble click). Al arrastrar o usar la
           rueda no se usa, para que responda de inmediato. */
        .paginas.suave {
            transition: transform 0.25s ease, opacity 0.15s ease;
        }

        .paginas.cambiando {
            opacity: 0;
        }

        .paginas img {
            display: block;
            width: auto;
            height: auto;
            max-width: 43vw;
            max-height: 82vh;
            object-fit: contain;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            cursor: zoom-in;
            -webkit-user-drag: none;
        }

        .paginas.sola img {
            max-width: 84vw;
        }

        .visor.ampliado .paginas img {
            cursor: grab;
        }

        .visor.arrastrando .paginas img {
            cursor: grabbing;
        }


        /* =====================================================
           CONTROLES
        ===================================================== */

        .cerrar {
            position: fixed;
            top: 16px;
            right: 24px;
            z-index: 2000;
            border: none;
            background: none;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cerrar.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .contador {
            position: fixed;
            left: 28px;
            bottom: 22px;
            z-index: 2000;
            font-size: 11px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .contador.visible {
            opacity: 1;
        }

        /* Control de zoom (abajo a la derecha) */
        .nav {
            position: fixed;
            right: 28px;
            bottom: 18px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .nav.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .nav button {
            border: none;
            background: none;
            padding: 0;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            cursor: pointer;
        }

        /* Porcentaje de zoom (también ajusta la vista al hacer click) */
        #nivel {
            font-size: 11px;
            min-width: 38px;
        }


        /* =====================================================
           FLECHAS LATERALES
           Zona de click grande, dibujo pequeño y delgado.
        ===================================================== */

        .flecha {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2000;

            width: 56px;
            height: 120px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            background: none;
            color: #111111;
            cursor: pointer;

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .flecha.izquierda { left: 14px; }
        .flecha.derecha   { right: 14px; }

        .flecha.visible {
            opacity: 0.4;
            pointer-events: auto;
        }

        .flecha.visible:hover,
        .flecha.visible:focus-visible {
            opacity: 1;
        }

        .flecha:focus-visible {
            outline: 1px solid #111111;
            outline-offset: -6px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1000px) {

            .grilla {
                grid-template-columns: repeat(4, 1fr);
                gap: 14px;
            }

        }

        @media (max-width: 700px) {

            header {
                padding: 18px;
                font-size: 11px;
            }

            .navegacion {
                gap: 20px;
            }

            .portafolio,
            body[data-estado="portada"] .portafolio {
                padding: 70px 18px 40px;
            }

            .grilla {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .contador {
                left: 18px;
                bottom: 18px;
            }

            .nav {
                right: 18px;
                bottom: 16px;
                gap: 12px;
            }

            .flecha {
                width: 32px;
                height: 96px;
            }

            .flecha.izquierda { left: 2px; }
            .flecha.derecha   { right: 2px; }

        }

        @media (prefers-reduced-motion: reduce) {

            body[data-estado="grilla"] .objeto {
                animation: none;
            }

            .paginas.suave {
                transition: opacity 0.15s ease;
            }

        }

    </style>

</head>

<script>

    const objetos    = document.querySelectorAll(".objeto");
    const visor      = document.querySelector("#visor");
    const paginas    = document.querySelector("#paginas");
    const cerrar     = document.querySelector(".cerrar");
    const contador   = document.querySelector(".contador");
    const nav        = document.querySelector(".nav");
    const flechas    = document.querySelectorAll(".flecha");
    const actual     = document.querySelector("#actual");
    const total      = document.querySelector("#total");
    const anterior   = document.querySelector("#anterior");
    const siguiente  = document.querySelector("#siguiente");
    const volver     = document.querySelector("#volver");
    const botonMas   = document.querySelector("#mas");
    const botonMenos = document.querySelector("#menos");
    const nivel      = document.querySelector("#nivel");

    const cantidad  = objetos.length;
    const pantallaChica = window.matchMedia("(max-width: 700px)");

    let vistas = [];          // cada vista es [índice] o [índice, índice]
    let vistaActiva = null;   // posición dentro de "vistas" (null = visor cerrado)

    const dos = n => String(n).padStart(2, "0");

    total.textContent = dos(cantidad);

    objetos.forEach((objeto, i) => objeto.style.setProperty("--i", i));


    /* =====================================================
       VISTAS
       Computador: portada sola, luego de a dos (2-3, 4-5...)
       Celular: una por una
    ===================================================== */

    function construirVistas() {

        vistas = [];

        if (pantallaChica.matches) {

            for (let i = 0; i < cantidad; i++) vistas.push([i]);

        } else {

            vistas.push([0]);

            for (let i = 1; i < cantidad; i += 2) {
                vistas.push(i + 1 < cantidad ? [i, i + 1] : [i]);
            }

        }

    }

    function vistaDeLamina(indice) {
        return vistas.findIndex(v => v.includes(indice));
    }


    /* =====================================================
       ESTADOS: portada ⇄ grilla
    ===================================================== */

    function irAGrilla() {
        document.body.dataset.estado = "grilla";
        window.scrollTo(0, 0);
    }

    function irAPortada() {
        cerrarVisor();
        document.body.dataset.estado = "portada";
        window.scrollTo(0, 0);
    }

    volver.addEventListener("click", irAPortada);

    objetos.forEach((objeto, index) => {

        objeto.addEventListener("click", () => {

            if (document.body.dataset.estado === "portada") {
                irAGrilla();
                return;
            }

            abrirVisor(index);

        });

    });


    /* =====================================================
       ZOOM
       Se aplica al spread completo (las dos páginas juntas),
       así la estructura de la doble página nunca se rompe.

       s = escala (1 = ajustado a pantalla)
       x, y = desplazamiento en píxeles
    ===================================================== */

    const ZOOM_MAX   = 3;     // 300 %  ← cámbialo aquí
    const ZOOM_PASO  = 1.5;   // cada click en + o −
    const ZOOM_DOBLE = 2;     // doble click
    const MARGEN     = 40;    // espacio extra al llegar al borde

    let s = 1;
    let x = 0;
    let y = 0;

    function aplicar(suave = false) {

        const ancho = paginas.offsetWidth  * s;
        const alto  = paginas.offsetHeight * s;
        const vw = visor.clientWidth;
        const vh = visor.clientHeight;

        // Límite de arrastre: el spread no puede salirse de la pantalla.
        // Si cabe completo en un eje, queda centrado en ese eje.
        const maxX = ancho > vw ? (ancho - vw) / 2 + MARGEN : 0;
        const maxY = alto  > vh ? (alto  - vh) / 2 + MARGEN : 0;

        x = Math.min(maxX, Math.max(-maxX, x));
        y = Math.min(maxY, Math.max(-maxY, y));

        paginas.classList.toggle("suave", suave);
        paginas.style.transform =
            "translate(" + x + "px, " + y + "px) scale(" + s + ")";

        visor.classList.toggle("ampliado", s > 1.01);
        nivel.textContent = Math.round(s * 100) + "%";

    }

    // Cambia el zoom manteniendo fijo el punto (px, py) bajo el cursor
    function zoomEn(nuevo, px, py, suave = false) {

        nuevo = Math.min(ZOOM_MAX, Math.max(1, nuevo));

        const cx = visor.clientWidth  / 2;
        const cy = visor.clientHeight / 2;

        const qx = (px - cx - x) / s;
        const qy = (py - cy - y) / s;

        x = px - cx - qx * nuevo;
        y = py - cy - qy * nuevo;
        s = nuevo;

        aplicar(suave);

    }

    function zoomCentro(factor) {
        zoomEn(
            s * factor,
            visor.clientWidth  / 2,
            visor.clientHeight / 2,
            true
        );
    }

    function reiniciarZoom(suave = false) {
        s = 1;
        x = 0;
        y = 0;
        aplicar(suave);
    }

    botonMas.addEventListener("click", () => zoomCentro(ZOOM_PASO));
    botonMenos.addEventListener("click", () => zoomCentro(1 / ZOOM_PASO));
    nivel.addEventListener("click", () => reiniciarZoom(true));


    /* Rueda del mouse / pellizco en trackpad */

    visor.addEventListener("wheel", event => {

        event.preventDefault();

        const delta = event.deltaMode === 1
            ? event.deltaY * 33
            : event.deltaY;

        const factor = Math.exp(-delta * (event.ctrlKey ? 0.01 : 0.002));

        zoomEn(s * factor, event.clientX, event.clientY);

    }, { passive: false });


    /* Doble click: acerca en ese punto, o vuelve a ajustar */

    visor.addEventListener("dblclick", event => {

        if (s > 1.01) {
            reiniciarZoom(true);
        } else {
            zoomEn(ZOOM_DOBLE, event.clientX, event.clientY, true);
        }

    });


    /* Arrastrar (mouse o dedo) y pellizcar (dos dedos) */

    const punteros = new Map();
    let ultimaDistancia = 0;
    let huboPellizco = false;
    let inicioToque = null;

    visor.addEventListener("dragstart", event => event.preventDefault());

    visor.addEventListener("pointerdown", event => {

        if (event.pointerType === "mouse" && event.button !== 0) return;

        visor.setPointerCapture(event.pointerId);
        punteros.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (punteros.size === 1) {
            inicioToque = { x: event.clientX, y: event.clientY };
            huboPellizco = false;
            if (s > 1.01) visor.classList.add("arrastrando");
        }

        if (punteros.size === 2) {
            huboPellizco = true;
            const [a, b] = [...punteros.values()];
            ultimaDistancia = Math.hypot(a.x - b.x, a.y - b.y);
        }

    });

    visor.addEventListener("pointermove", event => {

        if (!punteros.has(event.pointerId)) return;

        const previo = punteros.get(event.pointerId);
        punteros.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (punteros.size === 2) {

            const [a, b] = [...punteros.values()];
            const distancia = Math.hypot(a.x - b.x, a.y - b.y);

            if (ultimaDistancia > 0) {
                zoomEn(
                    s * distancia / ultimaDistancia,
                    (a.x + b.x) / 2,
                    (a.y + b.y) / 2
                );
            }

            ultimaDistancia = distancia;

        } else if (s > 1.01) {

            x += event.clientX - previo.x;
            y += event.clientY - previo.y;
            aplicar();

        }

    });

    function soltar(event) {

        if (!punteros.has(event.pointerId)) return;

        punteros.delete(event.pointerId);
        visor.classList.remove("arrastrando");

        if (punteros.size === 0) {

            // Deslizar de lado a lado cambia de lámina (solo táctil y sin zoom)
            if (
                inicioToque &&
                !huboPellizco &&
                s <= 1.01 &&
                event.pointerType === "touch" &&
                event.type === "pointerup"
            ) {

                const dx = event.clientX - inicioToque.x;
                const dy = event.clientY - inicioToque.y;

                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    ir(vistaActiva + (dx < 0 ? 1 : -1));
                }

            }

            inicioToque = null;

        }

    }

    visor.addEventListener("pointerup", soltar);
    visor.addEventListener("pointercancel", soltar);

    window.addEventListener("resize", () => {
        if (vistaActiva !== null) aplicar();
    });


    /* =====================================================
       VISOR
    ===================================================== */

    function dibujar() {

        const vista = vistas[vistaActiva];

        paginas.innerHTML = "";
        paginas.classList.toggle("sola", pantallaChica.matches);

        vista.forEach(i => {
            const img = document.createElement("img");
            img.src = objetos[i].querySelector("img").src;
            img.alt = "Lámina " + dos(i + 1);
            img.draggable = false;
            paginas.appendChild(img);
        });

        actual.textContent = vista.map(i => dos(i + 1)).join("–");

        // Cada spread nuevo parte ajustado a pantalla
        reiniciarZoom(false);

    }

    function abrirVisor(indiceLamina) {

        construirVistas();
        vistaActiva = vistaDeLamina(indiceLamina);
        dibujar();

        visor.classList.add("visible");
        cerrar.classList.add("visible");
        contador.classList.add("visible");
        nav.classList.add("visible");
        flechas.forEach(f => f.classList.add("visible"));

    }

    function cerrarVisor() {

        visor.classList.remove("visible");
        cerrar.classList.remove("visible");
        contador.classList.remove("visible");
        nav.classList.remove("visible");
        flechas.forEach(f => f.classList.remove("visible"));

        vistaActiva = null;

    }

    function ir(posicion) {

        if (vistaActiva === null) return;

        if (posicion < 0) posicion = vistas.length - 1;
        if (posicion >= vistas.length) posicion = 0;

        paginas.classList.add("cambiando");

        setTimeout(() => {
            vistaActiva = posicion;
            dibujar();
            paginas.classList.remove("cambiando");
        }, 150);

    }

    cerrar.addEventListener("click", cerrarVisor);
    anterior.addEventListener("click", () => ir(vistaActiva - 1));
    siguiente.addEventListener("click", () => ir(vistaActiva + 1));


    /* =====================================================
       TECLADO
    ===================================================== */

    document.addEventListener("keydown", event => {

        if (vistaActiva === null) return;

        if (event.key === "Escape") {
            if (s > 1.01) reiniciarZoom(true);
            else cerrarVisor();
        }

        if (event.key === "ArrowLeft")  ir(vistaActiva - 1);
        if (event.key === "ArrowRight") ir(vistaActiva + 1);

        if (event.key === "+" || event.key === "=") zoomCentro(ZOOM_PASO);
        if (event.key === "-" || event.key === "_") zoomCentro(1 / ZOOM_PASO);
        if (event.key === "0") reiniciarZoom(true);

    });


    /* =====================================================
       CAMBIO DE TAMAÑO (celular ⇄ computador)
       Mantiene la lámina que se estaba viendo.
    ===================================================== */

    pantallaChica.addEventListener("change", () => {

        if (vistaActiva === null) return;

        const laminaActual = vistas[vistaActiva][0];

        construirVistas();
        vistaActiva = vistaDeLamina(laminaActual);
        dibujar();

    });

</script>
